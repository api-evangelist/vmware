    name: Contact Sales
    type: enterprise
    description: All VMware (Broadcom) cloud-infrastructure offerings are sold
      via subscription through Broadcom direct sales or authorized partners. Pricing
      is negotiated per customer based on portfolio (VCF, vSphere Foundation, etc.),
      core / VM count, term, and support tier.
