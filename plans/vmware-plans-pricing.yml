description: VMware (a Broadcom company) does not publish list pricing for its
  cloud-infrastructure portfolio. Following the November 2023 Broadcom acquisition,
  VMware offerings (VMware Cloud Foundation, vSphere Foundation, NSX, Aria, VMware
  Cloud on AWS, Tanzu, Workspace ONE) are sold via subscription through Broadcom's
  authorized partner / direct-sales channel only. Quotes are negotiated per customer
  by core / VM / socket count. The scaffold has been trimmed to a single Contact
  Sales plan because no public pricing or per-tier API quotas exist.
sources:
  - https://www.broadcom.com/products/vmware-cloud-foundation
  - https://www.vmware.com/products/cloud-infrastructure/vsphere-foundation
notes: Pricing not publicly published. All VMware portfolio licensing flows through
  Broadcom direct sales or authorized partners; per-customer quotes are subscription-based
  and negotiated. No documented per-API-key plan tiers or self-service pricing.
plans:
