specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: VMware
providerId: vmware
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - Cloud Computing
  - Hybrid Cloud
  - Infrastructure
  - Virtualization
  - Rate Limiting
description: VMware (Broadcom) does not publish a single product-wide API rate-limit
  policy. Most VMware APIs (vSphere, NSX, vCloud Director, Aria, etc.) run inside
  customer-managed control planes (vCenter, NSX Manager, SDDC Manager) where
  request behavior is governed by the appliance's own throttling, session limits,
  and the underlying infrastructure rather than a published per-key quota. SaaS
  endpoints (VMware Cloud on AWS, Workspace ONE) document service-specific limits
  on a per-product basis. Trimmed scaffold; consult product-specific docs.
sources:
  - https://www.broadcom.com/support/vmware-services
  - https://developer.broadcom.com/
notes: No vendor-wide rate-limit policy is published. Rate limits are appliance-
  or service-specific and not exposed as a unified contract. Customers should
  consult each product's API reference (vCenter, NSX Manager, VMware Cloud on AWS,
  Workspace ONE) for documented throttling behavior.
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Per-product appliance limits
    scope: appliance
    metric: varies
    limit: see product-specific API reference
    notes: Each VMware control plane (vCenter, NSX Manager, SDDC Manager, Aria)
      enforces its own session, concurrency, and request-rate limits documented
      in its respective API reference.
policies:
  - name: Consult Product Docs
    description: There is no unified VMware/Broadcom rate-limit specification.
      Refer to the product-specific API reference for the appliance or SaaS
      endpoint being called.
  - name: Backoff and Retry
    description: Standard practice for VMware REST APIs is exponential backoff
      with jitter when 429 or 503 is returned, honoring Retry-After when present.
