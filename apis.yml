- type: Features
  url: https://www.vmware.com/products.html
  data:
  - name: vSphere Virtualization
    description: Industry-leading server virtualization platform for running and managing virtual machines across
      data center infrastructure.
  - name: NSX Networking
    description: Software-defined networking and security platform with micro-segmentation, load balancing, and
      distributed firewall.
  - name: vSAN Storage
    description: Hyper-converged software-defined storage integrated with vSphere for simplified storage management
      and high availability.
  - name: Tanzu Kubernetes
    description: Enterprise Kubernetes management for building, running, and managing modern containerized applications
      at scale.
  - name: Aria Operations
    description: AI-powered operations management for proactive performance optimization, capacity planning, and
      intelligent remediation.
  - name: Horizon VDI
    description: Virtual desktop and application delivery platform for secure remote work with published desktops
      and applications.
  - name: Cloud Foundation
    description: Integrated software stack for private and hybrid cloud with automated lifecycle management and
      consistent operations.
  - name: Site Recovery
    description: Automated disaster recovery and business continuity with recovery plan orchestration and non-disruptive
      testing.
  - name: Private AI
    description: On-premises AI infrastructure services for deploying and managing AI workloads within VMware environments.
- type: UseCases
  url: https://www.vmware.com/solutions.html
  data:
  - name: Data Center Modernization
    description: Transform traditional data centers with software-defined compute, storage, and networking for improved
      agility and efficiency.
  - name: Hybrid Cloud Operations
    description: Extend on-premises infrastructure to public clouds with consistent management, security, and networking
      across environments.
  - name: Application Modernization
    description: Containerize existing applications and deploy new cloud-native workloads on Kubernetes with enterprise-grade
      management.
  - name: Disaster Recovery
    description: Protect business-critical workloads with automated failover, recovery plan testing, and ransomware
      protection.
  - name: Virtual Desktop Infrastructure
    description: Deliver secure virtual desktops and applications to remote workers with centralized management
      and endpoint security.
  - name: Network Security
    description: Implement zero-trust security with micro-segmentation, distributed firewall, and threat detection
      across the network.
- type: Integrations
  url: https://www.vmware.com/partners.html
  data:
  - name: AWS
    description: VMware Cloud on AWS provides a jointly engineered hybrid cloud service running vSphere on AWS bare-metal
      infrastructure.
  - name: Microsoft Azure
    description: Azure VMware Solution runs VMware workloads natively on Azure with full vSphere, vSAN, and NSX
      integration.
  - name: Google Cloud
    description: Google Cloud VMware Engine provides a fully managed VMware environment on Google Cloud infrastructure.
  - name: Dell VxRail
    description: Jointly engineered hyperconverged infrastructure combining VCF with Dell PowerEdge servers for
      turnkey private cloud.
  - name: Kubernetes
    description: Native Kubernetes integration through Tanzu and vSphere with Kubernetes for container orchestration
      at enterprise scale.
  - name: Terraform
    description: Official VMware Terraform provider for infrastructure-as-code automation of vSphere, NSX, and VCF
      resources.
