  - https://www.vmware.com/products/cloud-infrastructure/vsphere-foundation
notes: VMware/Broadcom does not expose a vendor-wide usage or billing API; FinOps
  observability depends on contract entitlements, customer-side telemetry (vCenter,
  Aria Operations, Tanzu CloudHealth), and Broadcom-issued invoices.
