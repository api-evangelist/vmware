description: FinOps view of the VMware (Broadcom) portfolio. Licensing is sold as
  subscription bundles (VMware Cloud Foundation, vSphere Foundation) priced per
  core / VM, negotiated through Broadcom direct sales or authorized partners.
  No public pricing surface; FOCUS mapping is limited to invoice-side fields
  until customer-specific contract terms are observed.
sources:
