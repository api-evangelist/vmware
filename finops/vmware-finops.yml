meters:
  - name: subscription_term
    description: Subscription license entitlement covering the negotiated VMware
      portfolio bundle for a contract term.
    unit: varies
    aggregation: sum
    dimensions:
      - product
      - edition
      - core_count
      - term
principles:
  - name: Visibility
    description: VMware does not expose a vendor-side usage API. Use Aria Operations
      / VMware CloudHealth and SDDC Manager telemetry to observe consumption against
      the licensed entitlement; reconcile against the Broadcom invoice line items.
  - name: Allocation
    description: Allocate VMware spend by cluster, datacenter, and business unit
      using vCenter tags and Aria Operations cost views; map to Broadcom contract
      line items at the bundle / edition level.
  - name: Optimization
    description: Right-size VM core counts against the licensed core entitlement,
      consolidate workloads onto fewer hosts, and review bundle edition (VCF vs
      vSphere Foundation) at renewal.
  - name: Accountability
    description: Procurement and infrastructure-platform teams jointly own the
      Broadcom contract; per-cluster owners are accountable for staying within the
      negotiated entitlement.
