components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: header
      name: vmware-api-session-id
      description: >-
        Session token obtained from POST /session. Include this header
        in all subsequent API requests.
    basicAuth:
      type: http
      scheme: basic
      description: >-
        HTTP Basic authentication using vCenter Server credentials.
        Used primarily for creating sessions.

  parameters:
    vmId:
      name: vm
      in: path
      required: true
      description: Identifier of the virtual machine (e.g., vm-123)
      schema:
        type: string
    hostId:
      name: host
      in: path
      required: true
      description: Identifier of the ESXi host (e.g., host-10)
      schema:
        type: string
    datastoreId:
      name: datastore
      in: path
      required: true
      description: Identifier of the datastore (e.g., datastore-15)
      schema:
        type: string
    clusterId:
      name: cluster
      in: path
      required: true
      description: Identifier of the cluster (e.g., domain-c7)
      schema:
        type: string
    datacenterId:
      name: datacenter
      in: path
      required: true
      description: Identifier of the datacenter (e.g., datacenter-2)
      schema:
        type: string

  schemas:
    SessionInfo:
      type: object
      description: Information about the authenticated session
      properties:
        user:
          type: string
          description: Authenticated user principal name
        created_time:
          type: string
          format: date-time
          description: Time when the session was created
        last_accessed_time:
          type: string
          format: date-time
          description: Time when the session was last accessed

    VMSummary:
      type: object
      description: Summary of a virtual machine in the vCenter inventory
      required:
        - vm
        - name
      properties:
        vm:
          type: string
          description: Unique identifier of the virtual machine (e.g., vm-123)
        name:
          type: string
          description: Display name of the virtual machine
        power_state:
          type: string
          description: Current power state of the VM
          enum:
            - POWERED_ON
            - POWERED_OFF
            - SUSPENDED
        cpu_count:
          type: integer
          description: Number of virtual CPUs
        memory_size_MiB:
          type: integer
          description: Memory size in mebibytes

    VMCreateSpec:
      type: object
      description: Specification for creating a new virtual machine
      required:
        - name
        - guest_OS
        - placement
      properties:
        name:
          type: string
          description: Display name for the new VM
        guest_OS:
          type: string
          description: Guest operating system identifier
          enum:
            - RHEL_9_64
            - RHEL_8_64
            - UBUNTU_64
            - DEBIAN_11_64
            - WINDOWS_SERVER_2022
            - WINDOWS_SERVER_2019
            - WINDOWS_11_64
            - OTHER_LINUX_64
            - OTHER_64
        placement:
          type: object
          description: Placement specification for the VM
          properties:
            folder:
              type: string
              description: VM folder identifier
            host:
              type: string
              description: Host identifier for initial placement
            cluster:
              type: string
              description: Cluster identifier for initial placement
            resource_pool:
              type: string
              description: Resource pool identifier
            datastore:
              type: string
              description: Datastore identifier for VM files
        hardware_version:
          type: string
          description: Virtual hardware version
          enum:
            - VMX_21
            - VMX_20
            - VMX_19
            - VMX_18
            - VMX_17
            - VMX_16
            - VMX_15
            - VMX_14
            - VMX_13
        cpu:
          $ref: '#/components/schemas/CpuUpdateSpec'
        memory:
          $ref: '#/components/schemas/MemoryUpdateSpec'
        disks:
          type: array
          description: Virtual disks to create with the VM
          items:
            $ref: '#/components/schemas/DiskCreateSpec'
        nics:
          type: array
          description: Network adapters to create with the VM
          items:
            $ref: '#/components/schemas/EthernetCreateSpec'
        boot:
          type: object
          description: Boot configuration
          properties:
            type:
              type: string
              enum:
                - BIOS
                - EFI
            efi_legacy_boot:
              type: boolean
            delay:
              type: integer
              description: Boot delay in milliseconds
            enter_setup_mode:
              type: boolean
              description: Enter BIOS/EFI setup on next boot

    VMInfo:
      type: object
      description: Detailed virtual machine configuration and state
      properties:
        name:
          type: string
          description: Display name of the virtual machine
        identity:
          type: object
          description: VM identity information
          properties:
            name:
              type: string
            instance_uuid:
              type: string
              format: uuid
            bios_uuid:
              type: string
              format: uuid
        power_state:
          type: string
          enum:
            - POWERED_ON
            - POWERED_OFF
            - SUSPENDED
        guest_OS:
          type: string
          description: Configured guest operating system
        hardware:
          $ref: '#/components/schemas/HardwareInfo'
        boot:
          type: object
          properties:
            type:
              type: string
              enum:
                - BIOS
                - EFI
            delay:
              type: integer
            enter_setup_mode:
              type: boolean
        cpu:
          $ref: '#/components/schemas/CpuInfo'
        memory:
          $ref: '#/components/schemas/MemoryInfo'
        disks:
          type: object
          description: Map of disk identifier to disk configuration
          additionalProperties:
            $ref: '#/components/schemas/DiskInfo'
        nics:
          type: object
          description: Map of NIC identifier to NIC configuration
          additionalProperties:
            $ref: '#/components/schemas/EthernetInfo'
        cdroms:
          type: object
          description: Map of CD-ROM identifier to CD-ROM configuration
          additionalProperties:
            type: object
        parallel_ports:
          type: object
          additionalProperties:
            type: object
        serial_ports:
          type: object
          additionalProperties:
            type: object
        floppy_drives:
          type: object
          additionalProperties:
            type: object

    PowerInfo:
      type: object
      description: Power state information for a virtual machine
      properties:
        state:
          type: string
          description: Current power state
          enum:
            - POWERED_ON
            - POWERED_OFF
            - SUSPENDED
        clean_power_off:
          type: boolean
          description: Whether the last power-off was clean

    HardwareInfo:
      type: object
      description: Virtual hardware configuration
      properties:
        version:
          type: string
          description: Virtual hardware version (e.g., VMX_21)
        upgrade_policy:
          type: string
          description: Hardware upgrade policy
          enum:
            - NEVER
            - AFTER_CLEAN_SHUTDOWN
            - ALWAYS
        upgrade_version:
          type: string
          description: Target hardware version for upgrade

    HardwareUpdateSpec:
      type: object
      description: Specification for updating virtual hardware
      properties:
        upgrade_policy:
          type: string
          enum:
            - NEVER
            - AFTER_CLEAN_SHUTDOWN
            - ALWAYS
        upgrade_version:
          type: string

    CpuInfo:
      type: object
      description: CPU configuration of a virtual machine
      properties:
        count:
          type: integer
          description: Number of virtual CPU cores
        cores_per_socket:
          type: integer
          description: Number of cores per CPU socket
        hot_add_enabled:
          type: boolean
          description: Whether CPU hot-add is enabled
        hot_remove_enabled:
          type: boolean
          description: Whether CPU hot-remove is enabled

    CpuUpdateSpec:
      type: object
      description: Specification for CPU configuration
      properties:
        count:
          type: integer
          description: Number of virtual CPU cores
          minimum: 1
          maximum: 768
        cores_per_socket:
          type: integer
          description: Number of cores per socket
          minimum: 1
        hot_add_enabled:
          type: boolean
        hot_remove_enabled:
          type: boolean

    MemoryInfo:
      type: object
      description: Memory configuration of a virtual machine
      properties:
        size_MiB:
          type: integer
          description: Memory size in mebibytes
        hot_add_enabled:
          type: boolean
          description: Whether memory hot-add is enabled
        hot_add_increment_size_MiB:
          type: integer
          description: Granularity for memory hot-add in mebibytes
        hot_add_limit_MiB:
          type: integer
          description: Maximum memory size for hot-add in mebibytes

    MemoryUpdateSpec:
      type: object
      description: Specification for memory configuration
      properties:
        size_MiB:
          type: integer
          description: Memory size in mebibytes
          minimum: 4
        hot_add_enabled:
          type: boolean

    DiskSummary:
      type: object
      description: Summary of a virtual disk
      properties:
        disk:
          type: string
          description: Identifier of the virtual disk

    DiskInfo:
      type: object
      description: Detailed virtual disk configuration
      properties:
        label:
          type: string
          description: Display label of the virtual disk
        type:
          type: string
          description: Type of host bus adapter
          enum:
            - IDE
            - SCSI
            - SATA
            - NVME
        capacity:
          type: integer
          description: Capacity of the virtual disk in bytes
          format: int64
        backing:
          type: object
          description: Disk backing information
          properties:
            type:
              type: string
              enum:
                - VMDK_FILE
            vmdk_file:
              type: string
              description: Path to the VMDK file

    DiskCreateSpec:
      type: object
      description: Specification for creating a virtual disk
      properties:
        type:
          type: string
          description: Host bus adapter type
          enum:
            - IDE
            - SCSI
            - SATA
            - NVME
        new_vmdk:
          type: object
          description: Specification for a new VMDK file
          properties:
            name:
              type: string
              description: Name of the VMDK file
            capacity:
              type: integer
              description: Capacity in bytes
              format: int64
            storage_policy:
              type: object
              properties:
                policy:
                  type: string
                  description: Storage policy identifier
        backing:
          type: object
          description: Existing disk backing
          properties:
            type:
              type: string
              enum:
                - VMDK_FILE
            vmdk_file:
              type: string

    EthernetSummary:
      type: object
      description: Summary of a virtual network adapter
      properties:
        nic:
          type: string
          description: Identifier of the network adapter

    EthernetInfo:
      type: object
      description: Detailed virtual network adapter configuration
      properties:
        label:
          type: string
          description: Display label of the adapter
        type:
          type: string
          description: Adapter emulation type
          enum:
            - E1000
            - E1000E
            - PCNET32
            - VMXNET
            - VMXNET2
            - VMXNET3
        mac_type:
          type: string
          description: MAC address type
          enum:
            - MANUAL
            - GENERATED
            - ASSIGNED
        mac_address:
          type: string
          description: MAC address of the adapter
        state:
          type: string
          description: Connection state
          enum:
            - CONNECTED
            - NOT_CONNECTED
        start_connected:
          type: boolean
          description: Whether the adapter connects at power on
        backing:
          type: object
          description: Network backing information
          properties:
            type:
              type: string
              enum:
                - STANDARD_PORTGROUP
                - DISTRIBUTED_PORTGROUP
                - OPAQUE_NETWORK
                - HOST_DEVICE
            network:
              type: string
              description: Identifier of the backing network
        allow_guest_control:
          type: boolean
          description: Whether guest OS can change adapter settings
        wake_on_lan_enabled:
          type: boolean

    EthernetCreateSpec:
      type: object
      description: Specification for creating a virtual network adapter
      properties:
        type:
          type: string
          description: Adapter emulation type
          enum:
            - E1000
            - E1000E
            - PCNET32
            - VMXNET
            - VMXNET2
            - VMXNET3
        mac_type:
          type: string
          enum:
            - MANUAL
            - GENERATED
            - ASSIGNED
        mac_address:
          type: string
          description: MAC address (required when mac_type is MANUAL)
        backing:
          type: object
          properties:
            type:
              type: string
              enum:
                - STANDARD_PORTGROUP
                - DISTRIBUTED_PORTGROUP
                - OPAQUE_NETWORK
            network:
              type: string
              description: Identifier of the network
        start_connected:
          type: boolean
          default: true
        allow_guest_control:
          type: boolean
          default: false
        wake_on_lan_enabled:
          type: boolean
          default: false

    GuestIdentityInfo:
      type: object
      description: Guest operating system identity information from VMware Tools
      properties:
        name:
          type: string
          description: Guest OS full name
          examples:
            - Red Hat Enterprise Linux 9 (64-bit)
        family:
          type: string
          description: Guest OS family
          enum:
            - LINUX
            - WINDOWS
            - OTHER
        full_name:
          type: object
          properties:
            default_message:
              type: string
            id:
              type: string
        host_name:
          type: string
          description: Guest hostname
        ip_address:
          type: string
          description: Primary IP address of the guest
          format: ipv4

    GuestNetworkingInfo:
      type: object
      description: Guest OS networking information from VMware Tools
      properties:
        dns_values:
          type: object
          properties:
            domain_name:
              type: string
            search_domains:
              type: array
              items:
                type: string
        dns:
          type: object
          properties:
            ip_addresses:
              type: array
              items:
                type: string
        interfaces:
          type: array
          items:
            type: object
            properties:
              mac_address:
                type: string
              ip:
                type: object
                properties:
                  ip_addresses:
                    type: array
                    items:
                      type: object
                      properties:
                        ip_address:
                          type: string
                        prefix_length:
                          type: integer
                        state:
                          type: string
                          enum:
                            - PREFERRED
                            - DEPRECATED
                            - DUPLICATE
                            - INACCESSIBLE
                            - UNKNOWN

    HostSummary:
      type: object
      description: Summary of an ESXi host in the vCenter inventory
      required:
        - host
        - name
      properties:
        host:
          type: string
          description: Unique identifier of the host (e.g., host-10)
        name:
          type: string
          description: Display name or hostname of the ESXi host
        connection_state:
          type: string
          description: Connection state of the host
          enum:
            - CONNECTED
            - DISCONNECTED
            - NOT_RESPONDING
        power_state:
          type: string
          description: Power state of the host
          enum:
            - POWERED_ON
            - POWERED_OFF
            - STANDBY

    HostInfo:
      type: object
