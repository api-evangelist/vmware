components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: header
      name: vmware-api-session-id
      description: >-
        Session token obtained from POST /session. Include this header
        in all subsequent API requests.
    basicAuth:
      type: http
      scheme: basic
      description: >-
        HTTP Basic authentication using vCenter Server credentials.
        Used primarily for creating sessions.

  parameters:
    vmId:
      name: vm
      in: path
      required: true
      description: Identifier of the virtual machine (e.g., vm-123)
      schema:
        type: string
    hostId:
      name: host
      in: path
      required: true
      description: Identifier of the ESXi host (e.g., host-10)
      schema:
        type: string
    datastoreId:
      name: datastore
      in: path
      required: true
      description: Identifier of the datastore (e.g., datastore-15)
      schema:
        type: string
    clusterId:
      name: cluster
      in: path
      required: true
      description: Identifier of the cluster (e.g., domain-c7)
      schema:
        type: string
    datacenterId:
      name: datacenter
      in: path
      required: true
      description: Identifier of the datacenter (e.g., datacenter-2)
      schema:
        type: string

  schemas:
    SessionInfo:
      type: object
      description: Information about the authenticated session
      properties:
        user:
          type: string
          description: Authenticated user principal name
          example: example_value
        created_time:
          type: string
          format: date-time
          description: Time when the session was created
          example: '2026-01-15T10:30:00Z'
        last_accessed_time:
          type: string
          format: date-time
          description: Time when the session was last accessed

          example: '2026-01-15T10:30:00Z'
    VMSummary:
      type: object
      description: Summary of a virtual machine in the vCenter inventory
      required:
      - vm
      - name
      properties:
        vm:
          type: string
          description: Unique identifier of the virtual machine (e.g., vm-123)
          example: example_value
        name:
          type: string
          description: Display name of the virtual machine
          example: Example Title
        power_state:
          type: string
          description: Current power state of the VM
          enum:
          - POWERED_ON
          - POWERED_OFF
          - SUSPENDED
          example: POWERED_ON
        cpu_count:
          type: integer
          description: Number of virtual CPUs
          example: 10
        memory_size_MiB:
          type: integer
          description: Memory size in mebibytes

          example: 10
    VMCreateSpec:
      type: object
      description: Specification for creating a new virtual machine
      required:
      - name
      - guest_OS
      - placement
      properties:
        name:
          type: string
          description: Display name for the new VM
          example: Example Title
        guest_OS:
          type: string
          description: Guest operating system identifier
          enum:
          - RHEL_9_64
          - RHEL_8_64
          - UBUNTU_64
          - DEBIAN_11_64
          - WINDOWS_SERVER_2022
          - WINDOWS_SERVER_2019
          - WINDOWS_11_64
          - OTHER_LINUX_64
          - OTHER_64
          example: RHEL_9_64
        placement:
          type: object
          description: Placement specification for the VM
          properties:
            folder:
              type: string
              description: VM folder identifier
            host:
              type: string
              description: Host identifier for initial placement
            cluster:
              type: string
              description: Cluster identifier for initial placement
            resource_pool:
              type: string
              description: Resource pool identifier
            datastore:
              type: string
              description: Datastore identifier for VM files
          example: example_value
        hardware_version:
          type: string
          description: Virtual hardware version
          enum:
          - VMX_21
          - VMX_20
          - VMX_19
          - VMX_18
          - VMX_17
          - VMX_16
          - VMX_15
          - VMX_14
          - VMX_13
          example: VMX_21
        cpu:
          $ref: '#/components/schemas/CpuUpdateSpec'
        memory:
          $ref: '#/components/schemas/MemoryUpdateSpec'
        disks:
          type: array
          description: Virtual disks to create with the VM
          items:
            $ref: '#/components/schemas/DiskCreateSpec'
          example: []
        nics:
          type: array
          description: Network adapters to create with the VM
          items:
            $ref: '#/components/schemas/EthernetCreateSpec'
          example: []
        boot:
          type: object
          description: Boot configuration
          properties:
            type:
              type: string
              enum:
              - BIOS
              - EFI
            efi_legacy_boot:
              type: boolean
            delay:
              type: integer
              description: Boot delay in milliseconds
            enter_setup_mode:
              type: boolean
              description: Enter BIOS/EFI setup on next boot

          example: example_value
    VMInfo:
      type: object
      description: Detailed virtual machine configuration and state
      properties:
        name:
          type: string
          description: Display name of the virtual machine
          example: Example Title
        identity:
          type: object
          description: VM identity information
          properties:
            name:
              type: string
            instance_uuid:
              type: string
              format: uuid
            bios_uuid:
              type: string
              format: uuid
          example: example_value
        power_state:
          type: string
          enum:
          - POWERED_ON
          - POWERED_OFF
          - SUSPENDED
          example: POWERED_ON
        guest_OS:
          type: string
          description: Configured guest operating system
          example: example_value
        hardware:
          $ref: '#/components/schemas/HardwareInfo'
        boot:
          type: object
          properties:
            type:
              type: string
              enum:
              - BIOS
              - EFI
            delay:
              type: integer
            enter_setup_mode:
              type: boolean
          example: example_value
        cpu:
          $ref: '#/components/schemas/CpuInfo'
        memory:
          $ref: '#/components/schemas/MemoryInfo'
        disks:
          type: object
          description: Map of disk identifier to disk configuration
          additionalProperties:
            $ref: '#/components/schemas/DiskInfo'
          example: example_value
        nics:
          type: object
          description: Map of NIC identifier to NIC configuration
          additionalProperties:
            $ref: '#/components/schemas/EthernetInfo'
          example: example_value
        cdroms:
          type: object
          description: Map of CD-ROM identifier to CD-ROM configuration
          additionalProperties:
            type: object
          example: example_value
        parallel_ports:
          type: object
          additionalProperties:
            type: object
          example: example_value
        serial_ports:
          type: object
          additionalProperties:
            type: object
          example: example_value
        floppy_drives:
          type: object
          additionalProperties:
            type: object

          example: example_value
    PowerInfo:
      type: object
      description: Power state information for a virtual machine
      properties:
        state:
          type: string
          description: Current power state
          enum:
          - POWERED_ON
          - POWERED_OFF
          - SUSPENDED
          example: POWERED_ON
        clean_power_off:
          type: boolean
          description: Whether the last power-off was clean

          example: true
    HardwareInfo:
      type: object
      description: Virtual hardware configuration
      properties:
        version:
          type: string
          description: Virtual hardware version (e.g., VMX_21)
          example: example_value
        upgrade_policy:
          type: string
          description: Hardware upgrade policy
          enum:
          - NEVER
          - AFTER_CLEAN_SHUTDOWN
          - ALWAYS
          example: NEVER
        upgrade_version:
          type: string
          description: Target hardware version for upgrade

          example: example_value
    HardwareUpdateSpec:
      type: object
      description: Specification for updating virtual hardware
      properties:
        upgrade_policy:
          type: string
          enum:
          - NEVER
          - AFTER_CLEAN_SHUTDOWN
          - ALWAYS
          example: NEVER
        upgrade_version:
          type: string

          example: example_value
    CpuInfo:
      type: object
      description: CPU configuration of a virtual machine
      properties:
        count:
          type: integer
          description: Number of virtual CPU cores
          example: 10
        cores_per_socket:
          type: integer
          description: Number of cores per CPU socket
          example: 10
        hot_add_enabled:
          type: boolean
          description: Whether CPU hot-add is enabled
          example: true
        hot_remove_enabled:
          type: boolean
          description: Whether CPU hot-remove is enabled

          example: true
    CpuUpdateSpec:
      type: object
      description: Specification for CPU configuration
      properties:
        count:
          type: integer
          description: Number of virtual CPU cores
          minimum: 1
          maximum: 768
          example: 10
        cores_per_socket:
          type: integer
          description: Number of cores per socket
          minimum: 1
          example: 10
        hot_add_enabled:
          type: boolean
          example: true
        hot_remove_enabled:
          type: boolean

          example: true
    MemoryInfo:
      type: object
      description: Memory configuration of a virtual machine
      properties:
        size_MiB:
          type: integer
          description: Memory size in mebibytes
          example: 10
        hot_add_enabled:
          type: boolean
          description: Whether memory hot-add is enabled
          example: true
        hot_add_increment_size_MiB:
          type: integer
          description: Granularity for memory hot-add in mebibytes
          example: 10
        hot_add_limit_MiB:
          type: integer
          description: Maximum memory size for hot-add in mebibytes

          example: 10
    MemoryUpdateSpec:
      type: object
      description: Specification for memory configuration
      properties:
        size_MiB:
          type: integer
          description: Memory size in mebibytes
          minimum: 4
          example: 10
        hot_add_enabled:
          type: boolean

          example: true
    DiskSummary:
      type: object
      description: Summary of a virtual disk
      properties:
        disk:
          type: string
          description: Identifier of the virtual disk

          example: example_value
    DiskInfo:
      type: object
      description: Detailed virtual disk configuration
      properties:
        label:
          type: string
          description: Display label of the virtual disk
          example: Example Title
        type:
          type: string
          description: Type of host bus adapter
          enum:
          - IDE
          - SCSI
          - SATA
          - NVME
          example: IDE
        capacity:
          type: integer
          description: Capacity of the virtual disk in bytes
          format: int64
          example: 10
        backing:
          type: object
          description: Disk backing information
          properties:
            type:
              type: string
              enum:
              - VMDK_FILE
            vmdk_file:
              type: string
              description: Path to the VMDK file

          example: example_value
    DiskCreateSpec:
      type: object
      description: Specification for creating a virtual disk
      properties:
        type:
          type: string
          description: Host bus adapter type
          enum:
          - IDE
          - SCSI
          - SATA
          - NVME
          example: IDE
        new_vmdk:
          type: object
          description: Specification for a new VMDK file
          properties:
            name:
              type: string
              description: Name of the VMDK file
            capacity:
              type: integer
              description: Capacity in bytes
              format: int64
            storage_policy:
              type: object
              properties:
                policy:
                  type: string
                  description: Storage policy identifier
          example: example_value
        backing:
          type: object
          description: Existing disk backing
          properties:
            type:
              type: string
              enum:
              - VMDK_FILE
            vmdk_file:
              type: string

          example: example_value
    EthernetSummary:
      type: object
      description: Summary of a virtual network adapter
      properties:
        nic:
          type: string
          description: Identifier of the network adapter

          example: example_value
    EthernetInfo:
      type: object
      description: Detailed virtual network adapter configuration
      properties:
        label:
          type: string
          description: Display label of the adapter
          example: Example Title
        type:
          type: string
          description: Adapter emulation type
          enum:
          - E1000
          - E1000E
          - PCNET32
          - VMXNET
          - VMXNET2
          - VMXNET3
          example: E1000
        mac_type:
          type: string
          description: MAC address type
          enum:
          - MANUAL
          - GENERATED
          - ASSIGNED
          example: MANUAL
        mac_address:
          type: string
          description: MAC address of the adapter
          example: example_value
        state:
          type: string
          description: Connection state
          enum:
          - CONNECTED
          - NOT_CONNECTED
          example: CONNECTED
        start_connected:
          type: boolean
          description: Whether the adapter connects at power on
          example: true
        backing:
          type: object
          description: Network backing information
          properties:
            type:
              type: string
              enum:
              - STANDARD_PORTGROUP
              - DISTRIBUTED_PORTGROUP
              - OPAQUE_NETWORK
              - HOST_DEVICE
            network:
              type: string
              description: Identifier of the backing network
          example: example_value
        allow_guest_control:
          type: boolean
          description: Whether guest OS can change adapter settings
          example: true
        wake_on_lan_enabled:
          type: boolean

          example: true
    EthernetCreateSpec:
      type: object
      description: Specification for creating a virtual network adapter
      properties:
        type:
          type: string
          description: Adapter emulation type
          enum:
          - E1000
          - E1000E
          - PCNET32
          - VMXNET
          - VMXNET2
          - VMXNET3
          example: E1000
        mac_type:
          type: string
          enum:
          - MANUAL
          - GENERATED
          - ASSIGNED
          example: MANUAL
        mac_address:
          type: string
          description: MAC address (required when mac_type is MANUAL)
          example: example_value
        backing:
          type: object
          properties:
            type:
              type: string
              enum:
              - STANDARD_PORTGROUP
              - DISTRIBUTED_PORTGROUP
              - OPAQUE_NETWORK
            network:
              type: string
              description: Identifier of the network
          example: example_value
        start_connected:
          type: boolean
          default: true
          example: true
        allow_guest_control:
          type: boolean
          default: false
          example: true
        wake_on_lan_enabled:
          type: boolean
          default: false

          example: true
    GuestIdentityInfo:
      type: object
      description: Guest operating system identity information from VMware Tools
      properties:
        name:
          type: string
          description: Guest OS full name
          examples:
          - Red Hat Enterprise Linux 9 (64-bit)
        family:
          type: string
          description: Guest OS family
          enum:
          - LINUX
          - WINDOWS
          - OTHER
          example: LINUX
        full_name:
          type: object
          properties:
            default_message:
              type: string
            id:
              type: string
          example: example_value
        host_name:
          type: string
          description: Guest hostname
          example: example_value
        ip_address:
          type: string
          description: Primary IP address of the guest
          format: ipv4

          example: example_value
    GuestNetworkingInfo:
      type: object
      description: Guest OS networking information from VMware Tools
      properties:
        dns_values:
          type: object
          properties:
            domain_name:
              type: string
            search_domains:
              type: array
              items:
                type: string
          example: example_value
        dns:
          type: object
          properties:
            ip_addresses:
              type: array
              items:
                type: string
          example: example_value
        interfaces:
          type: array
          items:
            type: object
