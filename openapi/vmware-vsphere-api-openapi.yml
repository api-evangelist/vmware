            - NOT_RESPONDING
        power_state:
          type: string
          enum:
            - POWERED_ON
            - POWERED_OFF
            - STANDBY

    DatastoreSummary:
      type: object
      description: Summary of a datastore in the vCenter inventory
      required:
        - datastore
        - name
      properties:
        datastore:
          type: string
          description: Unique identifier of the datastore (e.g., datastore-15)
        name:
          type: string
          description: Display name of the datastore
        type:
          type: string
          description: Type of the datastore
          enum:
            - VMFS
            - NFS
            - NFS41
            - CIFS
            - VSAN
            - VFFS
            - VVOL
        free_space:
          type: integer
          description: Free space in bytes
          format: int64
        capacity:
          type: integer
          description: Total capacity in bytes
          format: int64

    DatastoreInfo:
      type: object
      description: Detailed datastore configuration and status
      properties:
        name:
          type: string
          description: Display name of the datastore
        type:
          type: string
          enum:
            - VMFS
            - NFS
            - NFS41
            - CIFS
            - VSAN
            - VFFS
            - VVOL
        accessible:
          type: boolean
          description: Whether the datastore is currently accessible
        free_space:
          type: integer
          description: Available free space in bytes
          format: int64
        capacity:
          type: integer
          description: Maximum capacity in bytes
          format: int64
        thin_provisioning_supported:
          type: boolean
