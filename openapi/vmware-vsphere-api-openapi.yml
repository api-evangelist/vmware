          type: string
          description: Library type
          enum:
            - LOCAL
            - SUBSCRIBED
        storage_backings:
          type: array
          description: Storage backings for the library content
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  - DATASTORE
                  - OTHER
              datastore_id:
                type: string
                description: Datastore identifier for DATASTORE type

    LibraryInfo:
      type: object
      description: Content library details
      properties:
        id:
          type: string
          description: Unique identifier of the content library
        name:
          type: string
          description: Name of the content library
        description:
          type: string
        type:
          type: string
          enum:
            - LOCAL
            - SUBSCRIBED
        creation_time:
          type: string
          format: date-time
        last_modified_time:
          type: string
          format: date-time
        last_sync_time:
          type: string
          format: date-time
        storage_backings:
          type: array
          items:
            type: object
            properties:
